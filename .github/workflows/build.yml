name: Build

on:
  push:
    tags:
      - 'v*'

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
        working-directory: electron-app
      - run: npm run build:deb
        working-directory: electron-app
      - uses: actions/upload-artifact@v4
        with:
          name: linux-deb
          path: electron-app/dist/*.deb

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
        working-directory: electron-app
      - run: npm run build:win
        working-directory: electron-app
      - uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: electron-app/dist/*.exe

  release:
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: linux-deb
          path: artifacts/
      - uses: actions/download-artifact@v4
        with:
          name: windows-exe
          path: artifacts/
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
